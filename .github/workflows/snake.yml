name: profile-dynamics

on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stats-card:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate stats card
        run: python .github/scripts/stats-card.py
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USERNAME: MainEmis

      - name: Deploy to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: "stats-card: refresh [${{ github.run_number }}]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
